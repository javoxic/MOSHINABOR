# Served by the admin container. TLS is terminated by the edge proxy/load balancer in front.
server {
  listen 80;
  server_name ${SERVER_NAME};
  server_tokens off;
  client_max_body_size 10m;

  root /usr/share/nginx/html;
  index index.html;

  include /etc/nginx/snippets/security-headers.conf;

  location = /healthz { access_log off; return 200 "ok\n"; }

  # Same-origin API (required for the SameSite=Strict admin refresh cookie). Also serves the mobile app.
  location /v1/ {
    proxy_pass http://${API_UPSTREAM};
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_read_timeout 60s;
  }

  location /docs { proxy_pass http://${API_UPSTREAM}; proxy_set_header Host $host; }

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/snippets/security-headers.conf;
    try_files $uri /index.html;
  }
}
