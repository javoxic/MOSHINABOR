# MOSHINA BOR — production stack (single host).
# Usage: cp .env.production.example .env && edit && docker compose up -d --build
name: moshina-bor

x-api-env: &api-env
  NODE_ENV: production
  DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?schema=public
  REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
  API_PUBLIC_URL: ${API_PUBLIC_URL}
  CORS_ORIGINS: ${CORS_ORIGINS}
  TRUST_PROXY: ${TRUST_PROXY:-2}
  SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET}
  JWT_ADMIN_SECRET: ${JWT_ADMIN_SECRET}
  OTP_PEPPER: ${OTP_PEPPER}
  SMS_PROVIDER: ${SMS_PROVIDER:-eskiz}
  SMS_INTERNATIONAL_PROVIDER: ${SMS_INTERNATIONAL_PROVIDER:-none}
  SMS_CALLBACK_SECRET: ${SMS_CALLBACK_SECRET}
  SMS_OTP_TEMPLATE_UZ: ${SMS_OTP_TEMPLATE_UZ:-}
  SMS_OTP_TEMPLATE_RU: ${SMS_OTP_TEMPLATE_RU:-}
  SMS_OTP_TEMPLATE_EN: ${SMS_OTP_TEMPLATE_EN:-}
  ESKIZ_EMAIL: ${ESKIZ_EMAIL:-}
  ESKIZ_PASSWORD: ${ESKIZ_PASSWORD:-}
  ESKIZ_FROM: ${ESKIZ_FROM:-4546}
  TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
  TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
  TWILIO_FROM: ${TWILIO_FROM:-}
  TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
  EXPO_ACCESS_TOKEN: ${EXPO_ACCESS_TOKEN:-}
  STORAGE_DIR: /app/storage
  APP_VERSION: ${APP_VERSION:-1.0.0}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      TZ: Asia/Tashkent
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [internal]

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--requirepass', '${REDIS_PASSWORD}', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes: [redisdata:/data]
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" --no-auth-warning ping | grep PONG']
      interval: 10s
      timeout: 5s
      retries: 10
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [internal]

  api:
    build: { context: ../.., dockerfile: infrastructure/docker/backend.Dockerfile }
    image: ${REGISTRY:-moshina-bor}/api:${APP_VERSION:-latest}
    restart: unless-stopped
    command: ['api']
    environment:
      <<: *api-env
      PROCESS_ROLE: api
      RUN_MIGRATIONS: 'true'
    volumes: [storage:/app/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks: [internal]

  worker:
    image: ${REGISTRY:-moshina-bor}/api:${APP_VERSION:-latest}
    restart: unless-stopped
    command: ['worker']
    environment:
      <<: *api-env
    volumes: [storage:/app/storage]
    healthcheck: { disable: true }
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

  admin:
    build: { context: ../.., dockerfile: infrastructure/docker/admin.Dockerfile }
    image: ${REGISTRY:-moshina-bor}/admin:${APP_VERSION:-latest}
    restart: unless-stopped
    environment:
      API_UPSTREAM: api:3000
      SERVER_NAME: ${ADMIN_SERVER_NAME:-_}
    ports: ['${HTTP_BIND:-127.0.0.1:8080}:80']
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

  backup:
    # Debian variant: ships GnuPG for archive encryption (same PostgreSQL major as the database).
    image: postgres:16-bookworm
    restart: unless-stopped
    entrypoint: ['/bin/sh', '/scripts/backup.sh']
    environment:
      PGHOST: postgres
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      BACKUP_PASSPHRASE_FILE: /run/secrets/backup_passphrase
      BACKUP_REQUIRE_ENCRYPTION: ${BACKUP_REQUIRE_ENCRYPTION:-true}
      TZ: Asia/Tashkent
    secrets: [backup_passphrase]
    volumes:
      - ./backup.sh:/scripts/backup.sh:ro
      - ${BACKUP_DIR:-./backups}:/backups
      - storage:/storage:ro
    depends_on:
      api: { condition: service_healthy }
    networks: [internal]

secrets:
  backup_passphrase:
    # Create with: mkdir -p secrets && openssl rand -base64 48 > secrets/backup_passphrase && chmod 600 secrets/backup_passphrase
    # Store a copy in your password manager — encrypted backups cannot be restored without it.
    file: ${BACKUP_PASSPHRASE_PATH:-./secrets/backup_passphrase}

volumes:
  pgdata:
  redisdata:
  storage:

networks:
  internal:
